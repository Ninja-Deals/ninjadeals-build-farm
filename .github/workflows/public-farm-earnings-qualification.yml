name: Disposable Earnings Full Stack Qualification
run-name: Earnings qualification ${{ inputs.source_ref }} from build ${{ inputs.build_run_id }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Full monorepo source SHA matching all 23 immutable build receipts'
        required: true
      build_run_id:
        description: 'Successful build-only farm run containing release artifacts for all 23 apps'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    if: github.repository == 'Ninja-Deals/ninjadeals-build-farm'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Validate immutable qualification inputs
        env:
          SOURCE: ${{ inputs.source_ref }}
          BUILD_RUN: ${{ inputs.build_run_id }}
        run: |
          python3 - <<'PY'
          import os,re
          if not re.fullmatch('[0-9a-f]{40}',os.environ['SOURCE']): raise SystemExit('Full source SHA required')
          if not re.fullmatch('[1-9][0-9]{0,19}',os.environ['BUILD_RUN']): raise SystemExit('Exact build run ID required')
          PY
      - name: Checkout exact private source
        uses: actions/checkout@v6
        with:
          repository: Ninja-Deals/ninjadeals-main
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          persist-credentials: false
          path: source
      - name: Obtain immutable release receipts
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          repository: Ninja-Deals/ninjadeals-build-farm
          run-id: ${{ inputs.build_run_id }}
          pattern: release-*
          path: receipts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install bounded fixture and browser tooling
        run: |
          python -m pip install pyyaml==6.0.2 cryptography==50.0.2
          npm ci --prefix source/frontend
          cd source/frontend
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/earnings-browsers" npx playwright install --with-deps chromium
          cd ..
          test ! -e node_modules
          ln -s "$PWD/frontend/node_modules" node_modules
      - name: Authenticate only image pulls
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PRIVATE_REPO_PAT }}
      - name: Run fresh isolated services and real browser journeys
        env:
          SOURCE: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          PYTHON_BIN=$(command -v python)
          NODE_BIN=$(command -v node)
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_EVENT_NAME=workflow_dispatch RUNNER_ENVIRONMENT=github-hosted \
            PATH="$PATH" DOCKER_CONFIG="$HOME/.docker" \
            "$PYTHON_BIN" source/scripts/test/earnings_ci.py \
            --source "$SOURCE" --receipts "$GITHUB_WORKSPACE/receipts" \
            --output "$GITHUB_WORKSPACE/evidence" --node "$NODE_BIN" \
            --browsers "$RUNNER_TEMP/earnings-browsers"
      - name: Upload sanitized qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earnings-qualification-${{ inputs.source_ref }}
          path: |
            evidence/qualification.json
            evidence/browser-summary.json
            evidence/synthetic-*.png
          if-no-files-found: warn
          retention-days: 14
