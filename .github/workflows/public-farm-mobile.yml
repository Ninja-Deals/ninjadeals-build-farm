name: Public Farm Mobile Build
run-name: Mobile build ${{ github.event.client_payload.platforms || inputs.platforms || 'android' }} ${{ github.event.client_payload.profile || inputs.profile || 'preview' }} from ${{ github.event.client_payload.ref || inputs.ref || 'main' }}

on:
  repository_dispatch:
    types: [trigger-mobile-build]
  workflow_dispatch:
    inputs:
      ref:
        description: 'ninjadeals-main ref to build'
        required: false
        default: 'main'
      platforms:
        description: 'Platforms to build'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - android
          - ios
      profile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
      issue:
        description: 'Optional ninjadeals-main issue number to comment with results'
        required: false
        default: ''

env:
  MONOREPO: Ninja-Deals/ninjadeals-main
  MOBILE_DIR: mobile
  # Resume iOS after a paid Apple Developer account exists and EAS has reusable
  # iOS signing credentials for the selected profile. Android remains active.
  IOS_BUILDS_PAUSED: 'true'

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.inputs.outputs.ref }}
      sha: ${{ steps.inputs.outputs.sha }}
      profile: ${{ steps.inputs.outputs.profile }}
      app_kind: ${{ steps.inputs.outputs.app_kind }}
      app_root: ${{ steps.inputs.outputs.app_root }}
      gradle_task: ${{ steps.inputs.outputs.gradle_task }}
      artifact_glob: ${{ steps.inputs.outputs.artifact_glob }}
      artifact_ext: ${{ steps.inputs.outputs.artifact_ext }}
      matrix: ${{ steps.inputs.outputs.matrix }}
      platforms: ${{ steps.inputs.outputs.platforms }}
      requested_platforms: ${{ steps.inputs.outputs.requested_platforms }}
      ios_paused: ${{ steps.inputs.outputs.ios_paused }}
      issue: ${{ steps.inputs.outputs.issue }}
    steps:
      - name: Resolve build inputs
        id: inputs
        env:
          REF_INPUT: ${{ inputs.ref }}
          REF_PAYLOAD: ${{ github.event.client_payload.ref }}
          SHA_PAYLOAD: ${{ github.event.client_payload.sha }}
          PROFILE_INPUT: ${{ inputs.profile }}
          PROFILE_PAYLOAD: ${{ github.event.client_payload.profile }}
          PLATFORMS_INPUT: ${{ inputs.platforms }}
          PLATFORMS_PAYLOAD: ${{ toJson(github.event.client_payload.platforms) }}
          APP_KIND_PAYLOAD: ${{ github.event.client_payload.app_kind }}
          APP_ROOT_PAYLOAD: ${{ github.event.client_payload.app_root }}
          GRADLE_TASK_PAYLOAD: ${{ github.event.client_payload.gradle_task }}
          ARTIFACT_GLOB_PAYLOAD: ${{ github.event.client_payload.artifact_glob }}
          ARTIFACT_EXT_PAYLOAD: ${{ github.event.client_payload.artifact_ext }}
          ISSUE_INPUT: ${{ inputs.issue }}
          ISSUE_PAYLOAD: ${{ github.event.client_payload.issue }}
          IOS_BUILDS_PAUSED: ${{ env.IOS_BUILDS_PAUSED }}
        run: |
          python3 <<'PY'
          import json
          import os

          def first(*values, default=""):
              for value in values:
                  if value is None:
                      continue
                  value = str(value).strip()
                  if value and value not in {"null", '""'}:
                      return value
              return default

          ref = first(os.getenv("REF_PAYLOAD"), os.getenv("REF_INPUT"), default="main")
          sha = first(os.getenv("SHA_PAYLOAD"), default="")
          profile = first(os.getenv("PROFILE_PAYLOAD"), os.getenv("PROFILE_INPUT"), default="preview")
          issue = first(os.getenv("ISSUE_PAYLOAD"), os.getenv("ISSUE_INPUT"), default="")
          app_kind = first(os.getenv("APP_KIND_PAYLOAD"), default="legacy_expo")
          app_root = first(os.getenv("APP_ROOT_PAYLOAD"), default="mobile")
          gradle_task = first(os.getenv("GRADLE_TASK_PAYLOAD"), default="")
          artifact_glob = first(os.getenv("ARTIFACT_GLOB_PAYLOAD"), default="")
          artifact_ext = first(os.getenv("ARTIFACT_EXT_PAYLOAD"), default="")

          if app_kind not in {"legacy_expo", "native_android"}:
              raise SystemExit(f"Invalid app_kind: {app_kind}")
          if app_kind == "native_android":
              if app_root != "android":
                  raise SystemExit("native_android builds must use app_root=android")
              if not gradle_task:
                  gradle_task = ":app:assembleInternalDebug"
              if not artifact_glob:
                  artifact_glob = "app/build/outputs/apk/internal/debug/app-internal-debug.apk"
              if not artifact_ext:
                  artifact_ext = "apk"
          else:
              app_root = "mobile"

          payload = os.getenv("PLATFORMS_PAYLOAD", "null")
          try:
              parsed = json.loads(payload)
          except Exception:
              parsed = None

          raw_platforms = []
          if isinstance(parsed, list):
              raw_platforms = parsed
          elif isinstance(parsed, str) and parsed.strip():
              raw_platforms = [parsed]
          else:
              raw_platforms = [first(os.getenv("PLATFORMS_INPUT"), default="all")]

          platforms = []
          for item in raw_platforms:
              for part in str(item).split(","):
                  part = part.strip().lower()
                  if part:
                      platforms.append(part)

          if not platforms or "all" in platforms:
              requested_platforms = ["android", "ios"]
          else:
              requested_platforms = [p for p in ["android", "ios"] if p in platforms]

          allowed = {"all", "android", "ios"}
          invalid = sorted(set(platforms) - allowed)
          if invalid:
              raise SystemExit(f"Invalid platform(s): {', '.join(invalid)}")

          ios_paused = os.getenv("IOS_BUILDS_PAUSED", "").lower() == "true" and "ios" in requested_platforms
          platforms = [p for p in requested_platforms if not (p == "ios" and ios_paused)]
          # A skipped build job still needs a syntactically valid matrix value.
          matrix = {"platform": platforms or ["android"]}
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as fh:
              fh.write(f"ref={ref}\n")
              fh.write(f"sha={sha}\n")
              fh.write(f"profile={profile}\n")
              fh.write(f"app_kind={app_kind}\n")
              fh.write(f"app_root={app_root}\n")
              fh.write(f"gradle_task={gradle_task}\n")
              fh.write(f"artifact_glob={artifact_glob}\n")
              fh.write(f"artifact_ext={artifact_ext}\n")
              fh.write(f"platforms={','.join(platforms)}\n")
              fh.write(f"requested_platforms={','.join(requested_platforms)}\n")
              fh.write(f"ios_paused={'true' if ios_paused else 'false'}\n")
              fh.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
              fh.write(f"issue={issue}\n")
          PY

  build:
    needs: resolve
    if: needs.resolve.outputs.platforms != ''
    runs-on: ${{ matrix.platform == 'ios' && 'macos-15' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    concurrency:
      group: mobile-${{ needs.resolve.outputs.ref }}-${{ matrix.platform }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      PLATFORM: ${{ matrix.platform }}
      PROFILE: ${{ needs.resolve.outputs.profile }}
      APP_KIND: ${{ needs.resolve.outputs.app_kind }}
      APP_ROOT: ${{ needs.resolve.outputs.app_root }}
      GRADLE_TASK: ${{ needs.resolve.outputs.gradle_task }}
      ARTIFACT_GLOB: ${{ needs.resolve.outputs.artifact_glob }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      NINJADEALS_STAGING_KEYSTORE_BASE64: ${{ secrets.NINJADEALS_STAGING_KEYSTORE_BASE64 }}
      NINJADEALS_STAGING_KEYSTORE_PASSWORD: ${{ secrets.NINJADEALS_STAGING_KEYSTORE_PASSWORD }}
      NINJADEALS_STAGING_KEY_ALIAS: ${{ secrets.NINJADEALS_STAGING_KEY_ALIAS }}
      NINJADEALS_STAGING_KEY_PASSWORD: ${{ secrets.NINJADEALS_STAGING_KEY_PASSWORD }}
      NINJADEALS_RELEASE_KEYSTORE_BASE64: ${{ secrets.NINJADEALS_RELEASE_KEYSTORE_BASE64 }}
      NINJADEALS_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NINJADEALS_RELEASE_KEYSTORE_PASSWORD }}
      NINJADEALS_RELEASE_KEY_ALIAS: ${{ secrets.NINJADEALS_RELEASE_KEY_ALIAS }}
      NINJADEALS_RELEASE_KEY_PASSWORD: ${{ secrets.NINJADEALS_RELEASE_KEY_PASSWORD }}
      ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Prepare artifact paths
        id: artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mobile-artifacts"
          if [ "${{ needs.resolve.outputs.artifact_ext }}" != "" ]; then
            EXT="${{ needs.resolve.outputs.artifact_ext }}"
          elif [ "$PLATFORM" = "android" ] && [ "$PROFILE" = "production" ]; then
            EXT="aab"
          elif [ "$PLATFORM" = "android" ]; then
            EXT="apk"
          else
            EXT="ipa"
          fi
          OUT="$RUNNER_TEMP/mobile-artifacts/ninjadeals-${PLATFORM}-${PROFILE}-${GITHUB_RUN_NUMBER}.${EXT}"
          DETAILS="$RUNNER_TEMP/mobile-artifacts/ninjadeals-${PLATFORM}-${PROFILE}-${GITHUB_RUN_NUMBER}.json"
          echo "output=$OUT" >> "$GITHUB_OUTPUT"
          echo "details=$DETAILS" >> "$GITHUB_OUTPUT"

      - name: Preflight credentials
        run: |
          set -euo pipefail
          if [ "$APP_KIND" = "native_android" ]; then
            echo "::notice title=Native Android build::Building clean-room native Android artifact from android/ with Gradle."
            exit 0
          fi
          if [ -z "${EXPO_TOKEN:-}" ]; then
            if [ "$PLATFORM" = "ios" ]; then
              printf '%s\n' "Missing EXPO_TOKEN. Set EXPO_TOKEN in the build-farm repository secrets so EAS can authenticate non-interactively." >&2
              exit 1
            fi
            if [ "$PLATFORM" = "android" ] && [ "$PROFILE" = "production" ]; then
              printf '%s\n' "Missing EXPO_TOKEN. Android production builds require EAS credentials/signing; set EXPO_TOKEN." >&2
              exit 1
            fi
            echo "::notice title=Android fallback build::EXPO_TOKEN is missing; building a debug-signed Android release APK with Expo prebuild + Gradle."
          fi
          if [ "$PLATFORM" = "android" ] && [ "$PROFILE" != "production" ]; then
            if [ -n "${EXPO_TOKEN:-}" ]; then
              echo "::notice title=EAS-signed Android preview build::Building preview APK with EAS local so Google Sign-In uses the configured Android signing fingerprint."
            else
              echo "::notice title=Android fallback build::Building preview APK directly with Expo prebuild + Gradle. Google Sign-In requires this debug signing SHA-1 to be registered in Google Cloud."
            fi
          fi
          if [ "$PLATFORM" = "ios" ]; then
            echo "iOS device-installable IPA builds require Apple signing credentials configured in EAS for the selected profile."
          fi

      - name: Checkout Private Monorepo
        uses: actions/checkout@v6
        with:
          repository: ${{ env.MONOREPO }}
          ref: ${{ needs.resolve.outputs.ref }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Resolve checkout SHA
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure native Android release signing
        if: needs.resolve.outputs.app_kind == 'native_android' && matrix.platform == 'android' && (needs.resolve.outputs.profile == 'staging' || needs.resolve.outputs.profile == 'production')
        run: |
          set -euo pipefail
          if [ "$PROFILE" = 'staging' ]; then
            key_store_base64="$NINJADEALS_STAGING_KEYSTORE_BASE64"
            key_store_password="$NINJADEALS_STAGING_KEYSTORE_PASSWORD"
            key_alias="$NINJADEALS_STAGING_KEY_ALIAS"
            key_password="$NINJADEALS_STAGING_KEY_PASSWORD"
            required_prefix='NINJADEALS_STAGING'
          else
            key_store_base64="$NINJADEALS_RELEASE_KEYSTORE_BASE64"
            key_store_password="$NINJADEALS_RELEASE_KEYSTORE_PASSWORD"
            key_alias="$NINJADEALS_RELEASE_KEY_ALIAS"
            key_password="$NINJADEALS_RELEASE_KEY_PASSWORD"
            required_prefix='NINJADEALS_RELEASE'
          fi
          for required in \
            'key_store_base64:KEYSTORE_BASE64' \
            'key_store_password:KEYSTORE_PASSWORD' \
            'key_alias:KEY_ALIAS' \
            'key_password:KEY_PASSWORD'; do
            value_name="${required%%:*}"
            secret_suffix="${required#*:}"
            if [ -z "${!value_name:-}" ]; then
              printf '%s\n' "Missing required native Android signing secret: ${required_prefix}_${secret_suffix}" >&2
              exit 1
            fi
          done
          key_store="$RUNNER_TEMP/ninjadeals-${PROFILE}.p12"
          printf '%s' "$key_store_base64" | base64 --decode > "$key_store"
          chmod 600 "$key_store"
          {
            echo "NINJA_RELEASE_STORE_FILE=$key_store"
            echo "NINJA_RELEASE_STORE_PASSWORD=$key_store_password"
            echo "NINJA_RELEASE_KEY_ALIAS=$key_alias"
            echo "NINJA_RELEASE_KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"

      - name: Materialise native Android Firebase configuration
        if: needs.resolve.outputs.app_kind == 'native_android' && matrix.platform == 'android'
        working-directory: ${{ needs.resolve.outputs.app_root }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            if [ "$PROFILE" = 'production' ]; then
              printf '%s\n' 'Missing ANDROID_GOOGLE_SERVICES_JSON_BASE64 for native Android production build.' >&2
              exit 1
            fi
            echo '::notice title=Native Android Firebase::No Firebase configuration supplied; non-production build will keep FCM dark.'
            exit 0
          fi
          config_path='app/google-services.json'
          config_tmp="$RUNNER_TEMP/ninjadeals-google-services.json"
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$config_tmp"
          jq -e '
            .project_info.project_id == "ninja-819de" and
            ([.client[]?.client_info.android_client_info.package_name] | sort) == [
              "com.ninjadeals.app",
              "com.ninjadeals.app.internal",
              "com.ninjadeals.app.staging"
            ]
          ' "$config_tmp" >/dev/null
          mkdir -p "$(dirname "$config_path")"
          mv "$config_tmp" "$config_path"
          chmod 600 "$config_path"

      - name: Setup Node
        if: needs.resolve.outputs.app_kind != 'native_android'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ env.MOBILE_DIR }}/package-lock.json

      - name: Setup Java for Android
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ needs.resolve.outputs.app_kind == 'native_android' && '25' || '17' }}

      - name: Setup Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          packages: tools platform-tools ndk;27.1.12297006 cmake;3.22.1

      - name: Restore generated Android project
        if: needs.resolve.outputs.app_kind != 'native_android' && env.EXPO_TOKEN == '' && matrix.platform == 'android' && needs.resolve.outputs.profile != 'production'
        id: android-native-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.MOBILE_DIR }}/android
          key: ${{ runner.os }}-expo-android-native-${{ hashFiles(format('{0}/package-lock.json', env.MOBILE_DIR), format('{0}/app.json', env.MOBILE_DIR), format('{0}/eas.json', env.MOBILE_DIR)) }}

      - name: Show Xcode version
        if: matrix.platform == 'ios'
        run: xcodebuild -version

      - name: Install mobile dependencies
        if: needs.resolve.outputs.app_kind != 'native_android'
        working-directory: ${{ env.MOBILE_DIR }}
        run: npm ci --prefer-offline --no-audit

      - name: Validate mobile TypeScript
        if: needs.resolve.outputs.app_kind != 'native_android'
        working-directory: ${{ env.MOBILE_DIR }}
        run: npm run typecheck

      - name: Install EAS CLI
        if: needs.resolve.outputs.app_kind != 'native_android' && env.EXPO_TOKEN != ''
        run: npm install -g eas-cli@latest

      - name: Build ${{ matrix.platform }} artifact with EAS
        if: needs.resolve.outputs.app_kind != 'native_android' && env.EXPO_TOKEN != ''
        working-directory: ${{ env.MOBILE_DIR }}
        env:
          EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
          EXPO_PUBLIC_API_BASE: https://staging.ninja.deals
          EXPO_PUBLIC_WEB_BASE: https://staging.ninja.deals
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 858507870976-ke3dkhrhr1t94uqaoifkbrh8c0m961qq.apps.googleusercontent.com
        run: |
          set -euo pipefail
          eas build \
            --local \
            --non-interactive \
            --platform "$PLATFORM" \
            --profile "$PROFILE" \
            --output "${{ steps.artifact.outputs.output }}"
          case "${{ steps.artifact.outputs.output }}" in
            *.apk)
              ;;
            *)
              exit 0
              ;;
          esac
          if [ "$PLATFORM" = "android" ]; then
            if ! unzip -p "${{ steps.artifact.outputs.output }}" assets/index.android.bundle \
              | grep -aF "$EXPO_PUBLIC_API_BASE" >/dev/null; then
              printf '%s\n' "Android preview bundle is missing EXPO_PUBLIC_API_BASE=$EXPO_PUBLIC_API_BASE" >&2
              exit 1
            fi
            if ! unzip -p "${{ steps.artifact.outputs.output }}" assets/index.android.bundle \
              | grep -aF "$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" >/dev/null; then
              printf '%s\n' "Android preview bundle is missing EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" >&2
              exit 1
            fi
          fi

      - name: Prepare Android native project
        if: needs.resolve.outputs.app_kind != 'native_android' && env.EXPO_TOKEN == '' && matrix.platform == 'android' && needs.resolve.outputs.profile != 'production'
        timeout-minutes: 8
        working-directory: ${{ env.MOBILE_DIR }}
        env:
          EXPO_PUBLIC_API_BASE: https://staging.ninja.deals
          EXPO_PUBLIC_WEB_BASE: https://staging.ninja.deals
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 858507870976-ke3dkhrhr1t94uqaoifkbrh8c0m961qq.apps.googleusercontent.com
        run: |
          set -euo pipefail
          if [ -d android ]; then
            npx expo prebuild --platform android --no-install --no-clean
          else
            npx expo prebuild --platform android --no-install
          fi
          if [ -z "${ANDROID_HOME:-}" ]; then
            printf '%s\n' "Missing Android SDK. ANDROID_HOME is not set after setup-android." >&2
            exit 1
          fi
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
          set_gradle_prop() {
            local key="$1"
            local value="$2"
            if grep -q "^${key}=" android/gradle.properties; then
              sed -i "s|^${key}=.*|${key}=${value}|" android/gradle.properties
            else
              echo "${key}=${value}" >> android/gradle.properties
            fi
          }
          # Expo SDK 57 / React Native 0.86 requires New Architecture codegen;
          # disabling it leaves generated native interfaces missing at compile time.
          set_gradle_prop newArchEnabled true
          # Preview APKs must work on both physical ARM64 devices and the x86_64
          # Android emulator used for local QA. Keep production on EAS.
          set_gradle_prop reactNativeArchitectures arm64-v8a,x86_64
          set_gradle_prop org.gradle.caching true
          set_gradle_prop org.gradle.parallel true
          set_gradle_prop org.gradle.workers.max 4
          set_gradle_prop org.gradle.jvmargs "-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Cache Gradle
        if: env.EXPO_TOKEN == '' && matrix.platform == 'android'
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.MOBILE_DIR }}/android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles(format('{0}/package-lock.json', env.MOBILE_DIR), format('{0}/app.json', env.MOBILE_DIR), format('{0}/eas.json', env.MOBILE_DIR)) }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Save generated Android project
        if: needs.resolve.outputs.app_kind != 'native_android' && env.EXPO_TOKEN == '' && matrix.platform == 'android' && needs.resolve.outputs.profile != 'production' && steps.android-native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.MOBILE_DIR }}/android
          key: ${{ steps.android-native-cache.outputs.cache-primary-key }}

      - name: Build Android preview APK with Gradle
        if: needs.resolve.outputs.app_kind != 'native_android' && env.EXPO_TOKEN == '' && matrix.platform == 'android' && needs.resolve.outputs.profile != 'production'
        timeout-minutes: 20
        working-directory: ${{ env.MOBILE_DIR }}
        env:
          # Gradle invokes Metro in this step, so Expo public values must be
          # present here as well as during the earlier prebuild step.
          EXPO_PUBLIC_API_BASE: https://staging.ninja.deals
          EXPO_PUBLIC_WEB_BASE: https://staging.ninja.deals
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 858507870976-ke3dkhrhr1t94uqaoifkbrh8c0m961qq.apps.googleusercontent.com
        run: |
          set -euo pipefail
          ./android/gradlew -p android assembleRelease --no-daemon --console=plain --stacktrace --build-cache --parallel --max-workers=4
          cp android/app/build/outputs/apk/release/app-release.apk "${{ steps.artifact.outputs.output }}"
          if ! unzip -p "${{ steps.artifact.outputs.output }}" assets/index.android.bundle \
            | grep -aF "$EXPO_PUBLIC_API_BASE" >/dev/null; then
            printf '%s\n' "Android preview bundle is missing EXPO_PUBLIC_API_BASE=$EXPO_PUBLIC_API_BASE" >&2
            exit 1
          fi
          if ! unzip -p "${{ steps.artifact.outputs.output }}" assets/index.android.bundle \
            | grep -aF "$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" >/dev/null; then
            printf '%s\n' "Android preview bundle is missing EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" >&2
            exit 1
          fi

      - name: Build native Android artifact with Gradle
        if: needs.resolve.outputs.app_kind == 'native_android' && matrix.platform == 'android'
        timeout-minutes: 25
        working-directory: ${{ needs.resolve.outputs.app_root }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            printf '%s\n' "Missing Android SDK. ANDROID_HOME is not set after setup-android." >&2
            exit 1
          fi
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon --no-configuration-cache --console=plain --stacktrace --build-cache --parallel "$GRADLE_TASK"
          cp "$ARTIFACT_GLOB" "${{ steps.artifact.outputs.output }}"
          if unzip -l "${{ steps.artifact.outputs.output }}" | grep -q 'lib/'; then
            if ! unzip -l "${{ steps.artifact.outputs.output }}" | grep -q 'lib/arm64-v8a/'; then
              printf '%s\n' "Native Android artifact contains native libraries but no arm64-v8a directory." >&2
              exit 1
            fi
          fi

      - name: Remove native Android Firebase configuration
        if: always() && needs.resolve.outputs.app_kind == 'native_android' && matrix.platform == 'android'
        working-directory: ${{ needs.resolve.outputs.app_root }}
        run: rm -f app/google-services.json

      - name: Verify mobile binary artifact
        run: |
          set -euo pipefail
          if [ ! -s "${{ steps.artifact.outputs.output }}" ]; then
            printf '%s\n' "Missing mobile artifact. Build completed but did not create ${{ steps.artifact.outputs.output }}" >&2
            exit 1
          fi

      - name: Write build details
        if: always()
        run: |
          set -euo pipefail
          STATUS="${{ job.status }}"
          ARTIFACT_PATH="${{ steps.artifact.outputs.output }}"
          CHECKED_SHA="${{ steps.source.outputs.sha }}"
          CHECKED_SHA="${CHECKED_SHA:-${{ needs.resolve.outputs.sha }}}"
          FAILURE_REASON=""
          if [ "$APP_KIND" = "native_android" ]; then
            if [ "$STATUS" != "success" ]; then
              FAILURE_REASON="native_android_gradle_failed"
            fi
          elif [ -z "${EXPO_TOKEN:-}" ]; then
            if [ "$PLATFORM" = "ios" ]; then
              FAILURE_REASON="missing_expo_token"
            elif [ "$STATUS" != "success" ]; then
              FAILURE_REASON="android_fallback_failed"
            fi
          elif [ "$STATUS" != "success" ] && [ ! -s "$ARTIFACT_PATH" ]; then
            FAILURE_REASON="missing_mobile_artifact"
          fi
          if [ "$APP_KIND" = "native_android" ]; then
            BUILD_MODE="native_android_gradle"
          elif [ -n "${EXPO_TOKEN:-}" ]; then
            BUILD_MODE="eas_local"
          elif [ "$PLATFORM" = "android" ] && [ "$PROFILE" != "production" ]; then
            BUILD_MODE="android_gradle_release_debug_signed"
          else
            BUILD_MODE="unavailable"
          fi
          python3 - <<PY
          import json
          data = {
              "status": "${STATUS}",
              "platform": "${PLATFORM}",
              "profile": "${PROFILE}",
              "app_kind": "${APP_KIND}",
              "build_mode": "${BUILD_MODE}",
              "monorepo": "${MONOREPO}",
              "ref": "${{ needs.resolve.outputs.ref }}",
              "sha": "${CHECKED_SHA}",
              "workflow_run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "artifact_file": "$(basename "$ARTIFACT_PATH")",
          }
          if "${APP_KIND}" == "native_android":
              data["gradle_task"] = "${GRADLE_TASK}"
              data["android_abis"] = ["arm64-v8a"]
          elif "${PLATFORM}" == "android" and "${PROFILE}" != "production":
              data["android_abis"] = ["arm64-v8a", "x86_64"]
          failure_reason = "${FAILURE_REASON}"
          if failure_reason:
              data["failure_reason"] = failure_reason
          with open("${{ steps.artifact.outputs.details }}", "w", encoding="utf-8") as fh:
              json.dump(data, fh, indent=2)
              fh.write("\\n")
          PY

      - name: Upload mobile artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ninjadeals-${{ matrix.platform }}-${{ needs.resolve.outputs.profile }}-${{ github.run_number }}
          path: |
            ${{ steps.artifact.outputs.output }}
            ${{ steps.artifact.outputs.details }}
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize build
        if: always()
        run: |
          CHECKED_SHA="${{ steps.source.outputs.sha }}"
          CHECKED_SHA="${CHECKED_SHA:-${{ needs.resolve.outputs.sha }}}"
          {
            echo "### NinjaDeals mobile ${PLATFORM} build"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Status | ${{ job.status }} |"
            echo "| Platform | ${PLATFORM} |"
            echo "| Profile | ${PROFILE} |"
            echo "| App kind | ${APP_KIND} |"
            echo "| Ref | ${{ needs.resolve.outputs.ref }} |"
            echo "| SHA | ${CHECKED_SHA} |"
            echo "| Artifact | ninjadeals-${PLATFORM}-${PROFILE}-${GITHUB_RUN_NUMBER} |"
            echo ""
            if [ "$APP_KIND" = "native_android" ]; then
              echo "Install: download the native Android APK/AAB artifact from this run. Internal/staging APKs are suitable for ARM64 physical-device QA installs."
            elif [ "$PLATFORM" = "android" ] && [ "$PROFILE" != "production" ]; then
              echo "Install: download the universal APK artifact from this run and sideload it on an ARM64 device or x86_64 Android emulator. This is a Gradle-built release APK for QA, not a Play/store-signed production build."
            elif [ "$PLATFORM" = "android" ]; then
              echo "Install: download the APK artifact from this run and sideload it on an Android test device."
            else
              echo "Install: download the IPA artifact from this run and install it on a device included in the EAS/Apple provisioning profile."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    needs: [resolve, build]
    if: always() && needs.resolve.outputs.issue != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Comment mobile build result
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          REPO: Ninja-Deals/ninjadeals-main
          ISSUE: ${{ needs.resolve.outputs.issue }}
          BUILD_RESULT: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLATFORMS: ${{ needs.resolve.outputs.platforms }}
          REQUESTED_PLATFORMS: ${{ needs.resolve.outputs.requested_platforms }}
          IOS_PAUSED: ${{ needs.resolve.outputs.ios_paused }}
          PROFILE: ${{ needs.resolve.outputs.profile }}
          REF: ${{ needs.resolve.outputs.ref }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$BUILD_RESULT" = "success" ]; then
            TITLE="Mobile build succeeded"
          else
            TITLE="Mobile build failed"
          fi
          BODY="$(cat <<BODY
          ### ${TITLE}

          | Field | Value |
          |---|---|
          | Requested platforms | ${REQUESTED_PLATFORMS} |
          | Built platforms | ${PLATFORMS:-none} |
          | Profile | ${PROFILE} |
          | Ref | ${REF} |
          | SHA | ${SHA} |

          Artifacts and install details: ${RUN_URL}
          BODY
          )"
          if [ "$IOS_PAUSED" = "true" ]; then
            BODY="${BODY}

          iOS is paused until a paid Apple Developer account is created and EAS iOS signing credentials are configured. Resume by setting IOS_BUILDS_PAUSED=false after credentials exist."
          fi
          gh api "repos/${REPO}/issues/${ISSUE}/comments" -X POST -f "body=${BODY}" >/dev/null
