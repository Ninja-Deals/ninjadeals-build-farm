name: Public Farm Native iOS Build
run-name: Native iOS ${{ github.event.client_payload.profile || inputs.profile || 'simulator' }}${{ (github.event.client_payload.upload == true || github.event.client_payload.upload == 'true' || inputs.upload) && ' + App Store Connect upload' || '' }} from ${{ github.event.client_payload.ref || inputs.ref || 'main' }}

on:
  repository_dispatch:
    types: [trigger-native-ios-build]
  workflow_dispatch:
    inputs:
      ref:
        description: ninjadeals-main ref to build
        required: false
        default: main
      profile:
        description: Native iOS artifact profile
        required: true
        type: choice
        default: simulator
        options:
          - simulator
          - staging
          - production
      build_number:
        description: Optional positive CFBundleVersion override
        required: false
        default: ''
      marketing_version:
        description: Optional semantic CFBundleShortVersionString override
        required: false
        default: ''
      upload:
        description: Upload the signed production IPA to App Store Connect (TestFlight); ref must be a full commit SHA and build_number is required
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  MONOREPO: Ninja-Deals/ninjadeals-main
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: macos-26
    # Static gate (serial package suite) ~13 min, archive ~14 min and the Smoke
    # build + test 14-33 min no longer fit the former 60-minute budget.
    timeout-minutes: 120
    concurrency:
      group: native-ios-${{ github.event.client_payload.ref || inputs.ref || 'main' }}-${{ github.event.client_payload.profile || inputs.profile || 'simulator' }}
      cancel-in-progress: false
    steps:
      - name: Resolve and validate inputs
        id: inputs
        env:
          REF_PAYLOAD: ${{ github.event.client_payload.ref }}
          REF_INPUT: ${{ inputs.ref }}
          SHA_PAYLOAD: ${{ github.event.client_payload.sha }}
          PROFILE_PAYLOAD: ${{ github.event.client_payload.profile }}
          PROFILE_INPUT: ${{ inputs.profile }}
          BUILD_PAYLOAD: ${{ github.event.client_payload.build_number }}
          BUILD_INPUT: ${{ inputs.build_number }}
          VERSION_PAYLOAD: ${{ github.event.client_payload.marketing_version }}
          VERSION_INPUT: ${{ inputs.marketing_version }}
          UPLOAD_PAYLOAD: ${{ github.event.client_payload.upload }}
          UPLOAD_INPUT: ${{ inputs.upload }}
        run: |
          python3 <<'PY'
          import os
          import re

          def first(*values, default=''):
              for value in values:
                  value = str(value or '').strip()
                  if value and value != 'null':
                      return value
              return default

          ref = first(os.getenv('REF_PAYLOAD'), os.getenv('REF_INPUT'), default='main')
          revision = first(os.getenv('SHA_PAYLOAD'))
          profile = first(os.getenv('PROFILE_PAYLOAD'), os.getenv('PROFILE_INPUT'), default='simulator')
          build = first(os.getenv('BUILD_PAYLOAD'), os.getenv('BUILD_INPUT'))
          version = first(os.getenv('VERSION_PAYLOAD'), os.getenv('VERSION_INPUT'))
          if profile not in {'simulator', 'staging', 'production'}:
              raise SystemExit(f'invalid native iOS profile: {profile}')
          # The ref reaches later run scripts through step outputs: keep it a plain Git ref.
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._/-]{0,199}', ref) or '..' in ref:
              raise SystemExit('ref must be a plain branch, tag or commit name')
          if revision and not re.fullmatch(r'[0-9a-f]{40}', revision):
              raise SystemExit('sha must be a complete lowercase Git revision')
          if build and not re.fullmatch(r'[1-9][0-9]*', build):
              raise SystemExit('build_number must be a positive integer')
          if version and not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:[.-][A-Za-z0-9]+)*', version):
              raise SystemExit('marketing_version must be semantic')
          upload = first(os.getenv('UPLOAD_PAYLOAD'), os.getenv('UPLOAD_INPUT'), default='false').lower()
          if upload not in {'true', 'false'}:
              raise SystemExit('upload must be true or false')
          if upload == 'true':
              # App Store build numbers are permanent: upload only an exact commit
              # with the dispatcher's monotonic build number, never a shallow-clone count.
              if profile != 'production':
                  raise SystemExit('App Store Connect upload is only supported for the production profile')
              if not revision and re.fullmatch(r'[0-9a-f]{40}', ref):
                  revision = ref
              if not revision or not build:
                  raise SystemExit('App Store Connect upload needs an exact sha (or a full-SHA ref) and build_number')
              if version and not re.fullmatch(r'[0-9]+(?:\.[0-9]+){0,2}', version):
                  raise SystemExit('App Store Connect needs one to three dot-separated integers as marketing_version')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for key, value in {
                  'ref': ref,
                  'sha': revision,
                  'profile': profile,
                  'build_number': build,
                  'marketing_version': version,
                  'signed': 'false' if profile == 'simulator' else 'true',
                  'upload': upload,
              }.items():
                  output.write(f'{key}={value}\n')
          PY

      # Fail before checkout and the long build when custody is incomplete.
      # Load secrets with scripts/mobile-native/ios-release-custody.py farm-sync
      # (runbook: ios/Documentation/Release.md in the monorepo).
      - name: Check native iOS release custody
        if: steps.inputs.outputs.signed == 'true'
        env:
          PROFILE: ${{ steps.inputs.outputs.profile }}
          UPLOAD: ${{ steps.inputs.outputs.upload }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          IOS_SHARE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROVISIONING_PROFILE_BASE64 }}
          NINJADEALS_PRODUCTION_IOS_GOOGLE_CLIENT_ID: ${{ secrets.NINJADEALS_PRODUCTION_IOS_GOOGLE_CLIENT_ID }}
          NINJADEALS_PRODUCTION_GOOGLE_SERVER_CLIENT_ID: ${{ secrets.NINJADEALS_PRODUCTION_GOOGLE_SERVER_CLIENT_ID }}
          IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          IOS_ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
          IOS_ASC_PRIVATE_KEY_BASE64: ${{ secrets.IOS_ASC_PRIVATE_KEY_BASE64 }}
          IOS_ASC_APP_APPLE_ID: ${{ secrets.IOS_ASC_APP_APPLE_ID }}
        run: |
          set -euo pipefail
          required=(IOS_TEAM_ID IOS_DISTRIBUTION_CERTIFICATE_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD
                    IOS_APP_PROVISIONING_PROFILE_BASE64 IOS_SHARE_PROVISIONING_PROFILE_BASE64)
          if [ "$PROFILE" = production ]; then
            required+=(NINJADEALS_PRODUCTION_IOS_GOOGLE_CLIENT_ID NINJADEALS_PRODUCTION_GOOGLE_SERVER_CLIENT_ID)
          fi
          if [ "$UPLOAD" = true ]; then
            required+=(IOS_ASC_KEY_ID IOS_ASC_ISSUER_ID IOS_ASC_PRIVATE_KEY_BASE64 IOS_ASC_APP_APPLE_ID)
          fi
          missing=()
          for name in "${required[@]}"; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Native iOS release custody::Missing build-farm secrets: ${missing[*]}"
            exit 2
          fi
          if [ "$UPLOAD" = true ] && [[ ! "$IOS_ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error title=Native iOS release custody::IOS_ASC_KEY_ID must be the 10-character App Store Connect key id"
            exit 2
          fi
          echo "Native iOS ${PROFILE} custody present (upload=${UPLOAD})."

      # Check out the exact dispatched commit (a later push to the branch must not
      # fail or change the build) and drop the token before third-party package
      # code builds next to the signing keychain.
      - name: Checkout private monorepo
        uses: actions/checkout@v6
        with:
          repository: ${{ env.MONOREPO }}
          ref: ${{ steps.inputs.outputs.sha || steps.inputs.outputs.ref }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          persist-credentials: false

      - name: Verify immutable source revision
        id: source
        env:
          EXPECTED_SHA: ${{ steps.inputs.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ -n "$EXPECTED_SHA" ] && [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "Requested revision $EXPECTED_SHA but checkout resolved $actual" >&2
            exit 1
          fi
          echo "sha=$actual" >> "$GITHUB_OUTPUT"

      - name: Select pinned Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          brew list ripgrep >/dev/null 2>&1 || brew install ripgrep
          ios/scripts/verify-xcode-installation.sh

      # The retired widget has no target, so only the app and Share Extension are
      # signed. The keychain password and ExportOptions.plist are not custody: the
      # password is random per job, and the export options are generated from the
      # profiles (validated against the configuration's bundle ids/entitlements).
      - name: Configure isolated Apple signing custody
        if: steps.inputs.outputs.signed == 'true'
        env:
          PROFILE: ${{ steps.inputs.outputs.profile }}
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/ninjadeals-ios.keychain-db"
          certificate="$RUNNER_TEMP/ninjadeals-ios.p12"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          rm -f "$certificate"

          # Xcode 16+ reads UserData; older tools still read MobileDevice. Install to both.
          installed=("$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
                     "$HOME/Library/MobileDevice/Provisioning Profiles")
          custody="$RUNNER_TEMP/ninjadeals-ios-profiles"
          mkdir -p "${installed[@]}" "$custody"
          for name in APP_PROFILE_BASE64 SHARE_PROFILE_BASE64; do
            raw="$custody/${name}.mobileprovision"
            printf '%s' "${!name}" | base64 --decode > "$raw"
            security cms -D -i "$raw" > "$custody/${name}.plist"
            uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$custody/${name}.plist")"
            for directory in "${installed[@]}"; do
              cp "$raw" "$directory/$uuid.mobileprovision"
            done
          done
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          python3 ios/scripts/distribution.py export-options --profile "$PROFILE" --team-id "$TEAM_ID" \
            --output "$export_options" "$custody"/*.mobileprovision
          plutil -lint "$export_options"
          {
            echo "NINJADEALS_TEAM_ID=$TEAM_ID"
            echo "NJD_IOS_EXPORT_OPTIONS_PLIST=$export_options"
            echo "NJD_IOS_EPHEMERAL_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      - name: Verify native project, package, metadata and release controls
        run: ios/scripts/verify-native-project.sh --static-only

      # The staging BFF is retired, so the simulator Smoke targets production. The
      # unsigned build has no Google client ids and the Smoke only reads anonymously.
      - name: Build unsigned simulator artifact
        if: steps.inputs.outputs.profile == 'simulator'
        env:
          NJD_IOS_BUILD_NUMBER: ${{ steps.inputs.outputs.build_number }}
          NJD_IOS_MARKETING_VERSION: ${{ steps.inputs.outputs.marketing_version }}
        run: |
          args=(--profile production --output-dir "$RUNNER_TEMP/native-ios" --unsigned-simulator)
          [ -n "$NJD_IOS_BUILD_NUMBER" ] && args+=(--build-number "$NJD_IOS_BUILD_NUMBER")
          [ -n "$NJD_IOS_MARKETING_VERSION" ] && args+=(--marketing-version "$NJD_IOS_MARKETING_VERSION")
          ios/scripts/archive.sh "${args[@]}"

      - name: Build signed device artifact
        if: steps.inputs.outputs.signed == 'true'
        env:
          PROFILE: ${{ steps.inputs.outputs.profile }}
          NJD_IOS_BUILD_NUMBER: ${{ steps.inputs.outputs.build_number }}
          NJD_IOS_MARKETING_VERSION: ${{ steps.inputs.outputs.marketing_version }}
          # Public OAuth client ids (iOS client + web server client); archive.sh
          # requires both for production and ignores them for staging.
          NJD_IOS_GOOGLE_CLIENT_ID: ${{ secrets.NINJADEALS_PRODUCTION_IOS_GOOGLE_CLIENT_ID }}
          NJD_IOS_GOOGLE_SERVER_CLIENT_ID: ${{ secrets.NINJADEALS_PRODUCTION_GOOGLE_SERVER_CLIENT_ID }}
        run: |
          args=(--profile "$PROFILE" --output-dir "$RUNNER_TEMP/native-ios" --export-options "$NJD_IOS_EXPORT_OPTIONS_PLIST")
          [ -n "$NJD_IOS_BUILD_NUMBER" ] && args+=(--build-number "$NJD_IOS_BUILD_NUMBER")
          [ -n "$NJD_IOS_MARKETING_VERSION" ] && args+=(--marketing-version "$NJD_IOS_MARKETING_VERSION")
          ios/scripts/archive.sh "${args[@]}"

      - name: Boot, install and launch simulator artifact
        id: smoke
        if: steps.inputs.outputs.profile == 'simulator'
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/native-ios/DerivedData/Build/Products/Production-iphonesimulator/NinjaDeals.app"
          bundle=com.ninjadeals.app
          if [ ! -d "$app" ]; then
            echo "Simulator build did not produce an installable NinjaDeals.app" >&2
            exit 1
          fi
          device_record="$(xcrun simctl list devices available --json | python3 -c '
          import json
          import sys

          devices = json.load(sys.stdin).get("devices", {})
          candidates = [
              (runtime, device)
              for runtime, runtime_devices in devices.items()
              if "iOS" in runtime
              for device in runtime_devices
              if device.get("isAvailable") and device.get("name", "").startswith("iPhone")
          ]
          if not candidates:
              raise SystemExit("no available iPhone simulator is installed")
          runtime, device = candidates[-1]
          os_version = runtime.rsplit("iOS-", 1)[-1].replace("-", ".")
          print(device["udid"], device["name"], os_version, sep="\t")
          ')"
          IFS=$'\t' read -r device_id device_name device_os <<< "$device_record"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" "$app"
          launch_output="$(xcrun simctl launch --terminate-running-process "$device_id" "$bundle")"
          printf '%s\n' "$launch_output"
          case "$launch_output" in
            "$bundle":\ *) ;;
            *) echo "Simulator launch did not return a NinjaDeals process identifier" >&2; exit 1 ;;
          esac
          export NJD_RUN_ID="build-farm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Production admits only the runner's anonymous read-only allowlist;
          # every fixture-owning method is reported as skipped, never run.
          scripts/test/run-ios-e2e.sh \
            --backend production \
            --severity smoke \
            --destination "platform=iOS Simulator,name=$device_name,OS=$device_os" \
            --profile current-ios-60hz-iphone \
            --artifact-dir "$RUNNER_TEMP/native-ios-smoke"
          # XCUITest may already terminate the application after the selected
          # method completes. Cleanup is best-effort and must not overwrite a
          # successful retained test result.
          xcrun simctl terminate "$device_id" "$bundle" 2>/dev/null || true
          xcrun simctl shutdown "$device_id" 2>/dev/null || true

      - name: Verify attributable Smoke runtime metadata
        if: steps.inputs.outputs.profile == 'simulator'
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python3 <<'PY'
          import os
          import sys
          from pathlib import Path

          repo = Path.cwd()
          sys.path.insert(0, str(repo / 'scripts' / 'test' / 'matrix'))
          import ios_metadata

          metadata_path = (
              Path(os.environ['RUNNER_TEMP'])
              / 'native-ios-smoke'
              / 'ios-e2e'
              / 'metadata.env'
          )
          metadata = {
              key: value
              for line in metadata_path.read_text(encoding='utf-8').splitlines()
              if '=' in line
              for key, value in [line.split('=', 1)]
          }
          expected = {
              'schema_version': '1',
              'backend': 'production',
              'backend_url': 'https://ninja.deals',
              'app_bundle_identifier': 'com.ninjadeals.app',
              'plans': 'Smoke',
              'selected_methods': 'LaunchJourneyTests/test_US_IOS_001__supported_ios_launch_reaches_an_owned_native_experience',
              'git_head': os.environ['EXPECTED_SHA'],
              'git_clean': 'true',
              'ios_evidence_revision': ios_metadata.current_evidence_revision(str(repo)),
              'repeat_attempt': '1',
              'repeat_total': '1',
              'xcodebuild_attempted': 'true',
              'failed': 'false',
              'evidence_failed': 'false',
              'flake': 'false',
              'fixture_preflight': 'passed',
              'preflight': 'passed',
          }
          mismatches = {
              key: (metadata.get(key), value)
              for key, value in expected.items()
              if metadata.get(key) != value
          }
          if mismatches:
              raise SystemExit(
                  'Smoke evidence metadata is not attributable and clean: '
                  + ', '.join(
                      f'{key}=actual:{actual!r}/expected:{wanted!r}'
                      for key, (actual, wanted) in sorted(mismatches.items())
                  )
              )
          PY

      - name: Verify attributable build metadata
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          PROFILE: ${{ steps.inputs.outputs.profile }}
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'native-ios'
          metadata = json.loads((root / 'build-metadata.json').read_text(encoding='utf-8'))
          if metadata['sourceRevision'] != os.environ['EXPECTED_SHA']:
              raise SystemExit('artifact metadata source revision mismatch')
          expected_environment = 'production' if os.environ['PROFILE'] == 'simulator' else os.environ['PROFILE']
          if metadata['environment'] != expected_environment:
              raise SystemExit('artifact metadata environment mismatch')
          artifact = root / metadata['artifact']
          if not artifact.is_file() or artifact.stat().st_size == 0:
              raise SystemExit('artifact metadata names a missing artifact')
          PY

      - name: Upload native iOS artifact and dSYM archive
        uses: actions/upload-artifact@v7
        with:
          name: ninjadeals-native-ios-${{ steps.inputs.outputs.profile }}-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/native-ios/*.ipa
            ${{ runner.temp }}/native-ios/*.zip
            ${{ runner.temp }}/native-ios/build-metadata.json
          if-no-files-found: error
          retention-days: 30

      # `altool --upload-package` (Apple deprecated --upload-app). The key lives
      # only in a private temp directory named by API_PRIVATE_KEYS_DIR and is
      # removed by the always-run cleanup. distribution.py also reads altool's
      # JSON, because Xcode 26 altool can exit 0 after a failed upload.
      - name: Upload production IPA to App Store Connect
        id: app_store_connect
        if: steps.inputs.outputs.upload == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.IOS_ASC_PRIVATE_KEY_BASE64 }}
          ASC_APP_APPLE_ID: ${{ secrets.IOS_ASC_APP_APPLE_ID }}
        run: |
          set -euo pipefail
          umask 077
          keys="$RUNNER_TEMP/ninjadeals-asc-keys"
          mkdir -p "$keys"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$keys/AuthKey_${ASC_KEY_ID}.p8"
          python3 ios/scripts/distribution.py upload \
            --artifact-dir "$RUNNER_TEMP/native-ios" \
            --app-apple-id "$ASC_APP_APPLE_ID" \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --private-keys-dir "$keys"

      # This repository is public. The .xcresult, the xcodebuild logs (raw under
      # private/, redacted under publish/) and failure text can quote private
      # source, so only attributable metadata is published, plus the JUnit of a
      # passing Smoke (test names only). Diagnose a failure with the encrypted
      # public-farm-native-ios-diagnose.yml workflow.
      - name: Stage public Smoke evidence
        if: always() && steps.inputs.outputs.profile == 'simulator'
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          lane="$RUNNER_TEMP/native-ios-smoke/ios-e2e"
          public="$RUNNER_TEMP/native-ios-smoke-public"
          mkdir -p "$public/publish"
          [ -f "$lane/metadata.env" ] && cp "$lane/metadata.env" "$public/"
          [ -f "$lane/publish/device-metadata.json" ] && cp "$lane/publish/device-metadata.json" "$public/publish/"
          if [ "$SMOKE_OUTCOME" = success ] && [ -d "$lane/junit" ]; then
            cp -R "$lane/junit" "$public/"
          fi

      - name: Upload native iOS Smoke runtime evidence
        if: always() && steps.inputs.outputs.profile == 'simulator'
        uses: actions/upload-artifact@v7
        with:
          name: ninjadeals-native-ios-smoke-${{ github.run_number }}
          path: ${{ runner.temp }}/native-ios-smoke-public
          if-no-files-found: error
          retention-days: 30

      - name: Summarize native iOS build
        if: always()
        run: |
          {
            echo '### NinjaDeals native iOS build'
            echo
            echo '| Field | Value |'
            echo '|---|---|'
            echo '| Status | ${{ job.status }} |'
            echo '| Profile | ${{ steps.inputs.outputs.profile }} |'
            echo '| Ref | ${{ steps.inputs.outputs.ref }} |'
            echo '| Revision | ${{ steps.source.outputs.sha }} |'
            echo '| Xcode | 26.6 (17F113) |'
            echo '| Artifact | ninjadeals-native-ios-${{ steps.inputs.outputs.profile }}-${{ github.run_number }} |'
            echo '| App Store Connect upload | ${{ steps.inputs.outputs.upload == 'true' && steps.app_store_connect.outcome || 'not requested' }} |'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove ephemeral signing material
        if: always() && steps.inputs.outputs.signed == 'true'
        run: |
          set +e
          security delete-keychain "${NJD_IOS_EPHEMERAL_KEYCHAIN:-$RUNNER_TEMP/ninjadeals-ios.keychain-db}"
          rm -f "$RUNNER_TEMP"/*.p12 "$RUNNER_TEMP"/ExportOptions.plist
          rm -rf "$RUNNER_TEMP/ninjadeals-ios-profiles" "$RUNNER_TEMP/ninjadeals-asc-keys"
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"/*.mobileprovision
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision
