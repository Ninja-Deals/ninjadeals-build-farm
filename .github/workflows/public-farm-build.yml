name: Public Farm Build (ARM64)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to build+deploy (comma-separated). Leave empty for all 26.'
        required: false
        default: ''
  repository_dispatch:
    types: [trigger-build]

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── SETUP ───────────────────────────────────────────────────────────────────
  # Resolve which services to build. No bastion work here.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      services: ${{ steps.set-matrix.outputs.services }}
    steps:
      - name: Resolve service list
        id: set-matrix
        run: |
          FULL='["bff","comment","deal","discovery","following","forum","frontend","hello","identity","inbox","indexing-projection","media","moderation","notification","offer","price-collector","price-history","pricing","ranking","reputation","rewards","saved-items","search","user-profile","vote","wallet"]'

          SERVICES_INPUT="${{ inputs.services }}"
          SERVICES_PAYLOAD='${{ toJson(github.event.client_payload.services) }}'

          if [ -n "$SERVICES_INPUT" ]; then
            LIST=$(echo "$SERVICES_INPUT" | python3 -c "
          import sys, json
          raw = sys.stdin.read().strip()
          services = [s.strip() for s in raw.split(',') if s.strip()]
          print(json.dumps(services))
          ")
            echo "Manual trigger: $LIST"
          elif [ -n "$SERVICES_PAYLOAD" ] && [ "$SERVICES_PAYLOAD" != "null" ] && [ "$SERVICES_PAYLOAD" != '""' ]; then
            LIST=$(echo "$SERVICES_PAYLOAD" | jq -c '.')
            echo "Repository dispatch: $LIST"
          else
            LIST=$FULL
            echo "Full build: all 26 services"
          fi

          # matrix for parallel build jobs
          echo "matrix={\"service\":$LIST}" >> $GITHUB_OUTPUT
          # space-separated list for the single deploy job
          echo "services=$(echo $LIST | jq -r '.[]' | tr '\n' ' ')" >> $GITHUB_OUTPUT

  # ── BUILD ────────────────────────────────────────────────────────────────────
  # All services build in parallel. No bastion, no OCI CLI — just docker buildx.
  build:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Private Monorepo
        uses: actions/checkout@v6
        with:
          repository: 'Ninja-Deals/ninjadeals-main'
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Build and Push ${{ matrix.service }} (ARM64)
        run: |
          IMAGE="ghcr.io/ninja-deals/ninjadeals-main/${{ matrix.service }}:latest"
          if [ "${{ matrix.service }}" = "frontend" ]; then
            docker buildx build --platform linux/arm64 \
              --build-arg NEXT_PUBLIC_CAPTCHA_ENABLED=false \
              --build-arg NEXT_PUBLIC_OLA_MAPS_API_KEY="${{ secrets.NEXT_PUBLIC_OLA_MAPS_API_KEY }}" \
              --cache-from=type=gha,scope=frontend \
              --cache-to=type=gha,mode=max,scope=frontend \
              --push -f frontend/Dockerfile -t $IMAGE frontend/
          elif [ "${{ matrix.service }}" = "ranking" ]; then
            docker buildx build --platform linux/arm64 \
              --cache-from=type=gha,scope=ranking \
              --cache-to=type=gha,mode=max,scope=ranking \
              --push -f services/ranking/Dockerfile -t $IMAGE services/ranking/
          else
            docker buildx build --platform linux/arm64 \
              --cache-from=type=gha,scope=${{ matrix.service }} \
              --cache-to=type=gha,mode=max,scope=${{ matrix.service }} \
              --push -f services/${{ matrix.service }}/Dockerfile -t $IMAGE .
          fi

  # ── DEPLOY ───────────────────────────────────────────────────────────────────
  # Single job. Opens ONE bastion tunnel after all builds complete, then deploys
  # all services sequentially through it. No concurrent SSH connections.
  deploy:
    needs: [setup, build]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false

    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_KEY_FILE }}
      OCI_CLI_REGION: ${{ secrets.OCI_REGION }}
      SERVICES: ${{ needs.setup.outputs.services }}

    steps:
      - name: Checkout Private Monorepo
        uses: actions/checkout@v6
        with:
          repository: 'Ninja-Deals/ninjadeals-main'
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Set up OCI CLI
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        with:
          command: 'oci --version'

      - name: Create Bastion Session
        run: |
          # Clean up any stale sessions first
          STALE=$(oci bastion session list \
            --bastion-id ${{ secrets.BASTION_ID }} \
            --session-lifecycle-state ACTIVE \
            --query "data[*].id" --raw-output 2>/dev/null || true)
          for sid in $STALE; do
            echo "Removing stale session: $sid"
            oci bastion session delete --session-id "$sid" --force 2>/dev/null || true
          done
          [ -n "$STALE" ] && sleep 10

          tr -d '\n\r' < infra/bastion_key.pub > b_key.pub
          SESSION_ID=$(oci bastion session create-port-forwarding \
            --bastion-id ${{ secrets.BASTION_ID }} \
            --display-name "deploy-${{ github.run_id }}" \
            --ssh-public-key-file b_key.pub \
            --target-private-ip 10.0.30.20 \
            --target-port 22 \
            --session-ttl 1800 \
            --query "data.id" --raw-output 2>/tmp/oci_err || true)

          if [ -z "$SESSION_ID" ] || [ "$SESSION_ID" = "null" ]; then
            echo "ERROR: Failed to create bastion session:"
            cat /tmp/oci_err
            exit 1
          fi
          echo "Created session: $SESSION_ID"

      - name: Wait for Session ACTIVE
        run: |
          for i in {1..30}; do
            STATE=$(oci bastion session list \
              --bastion-id ${{ secrets.BASTION_ID }} \
              --session-lifecycle-state ACTIVE \
              --query "data[0].id" --raw-output 2>/dev/null || true)
            if [ -n "$STATE" ] && [ "$STATE" != "null" ]; then
              echo "Session ACTIVE"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 10
          done
          if [ -z "$STATE" ] || [ "$STATE" = "null" ]; then
            echo "ERROR: Session never became active"
            exit 1
          fi

      - name: Open Bastion Tunnel
        run: |
          SESSION_ID=$(oci bastion session list \
            --bastion-id ${{ secrets.BASTION_ID }} \
            --session-lifecycle-state ACTIVE \
            --query "data[0].id" --raw-output)

          SSH_CMD=$(oci bastion session get \
            --session-id "$SESSION_ID" \
            --query "data.\"ssh-metadata\".command" --raw-output)

          if [ -n "${{ secrets.BASTION_PRIVATE_KEY }}" ]; then
            echo "${{ secrets.BASTION_PRIVATE_KEY }}" > b_key
          else
            cp infra/bastion_key b_key
          fi
          chmod 600 b_key

          if [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > d_key
          else
            cp infra/deploy_ssh_key d_key
          fi
          chmod 600 d_key

          FINAL=$(echo "$SSH_CMD" \
            | sed "s|<privateKey>|b_key|g" \
            | sed "s|<localPort>|2222|g" \
            | sed "s|ssh |ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes |")

          $FINAL &
          echo $! > /tmp/tunnel_pid

          for i in {1..30}; do
            if nc -z localhost 2222 2>/dev/null; then
              echo "Tunnel established."
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: Tunnel failed to establish"
          exit 1

      - name: Preflight — verify apps host is bootstrapped
        run: |
          # The deploy assumes cloud-init seeded /opt/ninjadeals/services/{services.yml,.env}
          # on first boot. If cloud-init failed (or the VM was recreated and never
          # re-provisioned), those files are missing and the deploy below dies with a
          # cryptic "cd: No such file or directory". Fail fast with a fix instead.
          if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
               -o IdentitiesOnly=yes -i d_key -p 2222 opc@127.0.0.1 \
               "test -f /opt/ninjadeals/services/services.yml && test -f /opt/ninjadeals/services/.env"; then
            echo "Apps host bootstrapped: /opt/ninjadeals/services/{services.yml,.env} present."
          else
            echo "::error title=Apps host not bootstrapped::/opt/ninjadeals/services/{services.yml,.env} missing on 10.0.30.20"
            echo "::error::The apps VM cloud-init did not seed the compose dir (likely failed on first boot, or the VM was recreated)."
            echo "::error::Bootstrap it once, then re-run this deploy. Either:"
            echo "::error::  (a) re-provision so the fixed cloud-init runs fresh:  cd infra && tofu taint oci_core_instance.apps && tofu apply"
            echo "::error::  (b) seed the running host by hand: create /opt/ninjadeals/services, copy infra/compose/services.yml there, and write .env via /usr/local/bin/fetch_secret.sh (see scripts/deploy/deploy.sh in the monorepo)."
            exit 1
          fi

      - name: Sync compose file from monorepo to host
        run: |
          # The host's /opt/ninjadeals/services/services.yml was only ever seeded by
          # cloud-init and then drifted from git — so monorepo changes to the compose
          # config (e.g. IDENTITY_CAPTCHA_ENABLED defaults, new env vars) never reached
          # staging via this deploy. Push the checked-out monorepo copy on every deploy so
          # git is the single source of truth for compose config. Runtime secrets stay in
          # the host .env (untouched here). `up -d` below re-reads both.
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o IdentitiesOnly=yes -i d_key -P 2222 \
            infra/compose/services.yml opc@127.0.0.1:/tmp/services.yml
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o IdentitiesOnly=yes -i d_key -p 2222 opc@127.0.0.1 \
            "sudo cp /tmp/services.yml /opt/ninjadeals/services/services.yml && rm -f /tmp/services.yml"
          echo "services.yml synced from monorepo to host."

      - name: Deploy All Services
        run: |
          echo "Deploying: $SERVICES"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o IdentitiesOnly=yes -i d_key -p 2222 opc@127.0.0.1 \
            "sudo docker image prune -af --filter 'until=24h' 2>/dev/null || true && \
             cd /opt/ninjadeals/services && \
             sudo docker compose -f services.yml pull $SERVICES && \
             sudo docker compose -f services.yml up -d $SERVICES"
          echo "All services deployed."

      - name: Close Tunnel
        if: always()
        run: kill $(cat /tmp/tunnel_pid) 2>/dev/null || true

  # ── NOTIFY ───────────────────────────────────────────────────────────────────
  # Report the deploy outcome back to the orchestrator by labelling the issue in
  # the private monorepo (deploy:success / deploy:failed). The orchestrator reacts
  # via the GitHub webhook it already receives — this routes around the Cloudflare
  # Bot Fight Mode challenge that blocks a direct POST. On failure the complete
  # error log is posted as an issue comment so the issue can be re-fixed.
  #
  # Driven off the repository_dispatch client_payload.issue, so manual / push
  # builds (no issue) simply skip the report.
  notify:
    needs: [setup, build, deploy]
    if: always() && github.event.client_payload.issue != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Report deploy result to the issue
        env:
          # PAT with access to the private monorepo (same token used for checkout).
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          REPO: Ninja-Deals/ninjadeals-main
          ISSUE: ${{ github.event.client_payload.issue }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          add_label() {  # add a label to the issue (label is pre-created in the repo)
            gh api "repos/$REPO/issues/$ISSUE/labels" -X POST -f "labels[]=$1" >/dev/null
          }
          comment() { gh api "repos/$REPO/issues/$ISSUE/comments" -X POST -f body="$1" >/dev/null; }

          if [ "$BUILD_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            echo "Deploy succeeded for issue #$ISSUE"
            comment "🚀 Build-farm deploy to \`staging\` succeeded. ${RUN_URL}"
            add_label "deploy:success"
          else
            echo "Deploy failed for issue #$ISSUE — gathering logs"
            LOG=""
            JOBS=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs?per_page=100")
            for jid in $(echo "$JOBS" | jq -r '.jobs[] | select(.conclusion=="failure") | .id'); do
              JLOG=$(gh api "repos/${{ github.repository }}/actions/jobs/${jid}/logs" 2>/dev/null || true)
              LOG="${LOG}
          ===== failed job ${jid} =====
          ${JLOG}"
            done
            LOG=$(printf '%s' "$LOG" | tail -c 30000)
            comment "$(printf '%s\n\n%s\n\n```\n%s\n```' '❌ Build-farm deploy **failed** — staying at `status:done`, flagging for human review.' "$RUN_URL" "$LOG")"
            add_label "deploy:failed"
          fi

  # ── TEARDOWN ─────────────────────────────────────────────────────────────────
  teardown:
    needs: [setup, deploy]
    if: always()
    runs-on: ubuntu-latest
    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_KEY_FILE }}
      OCI_CLI_REGION: ${{ secrets.OCI_REGION }}
    steps:
      - name: Set up OCI CLI
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        with:
          command: 'oci --version'

      - name: Delete Bastion Session
        run: |
          SESSIONS=$(oci bastion session list \
            --bastion-id ${{ secrets.BASTION_ID }} \
            --session-lifecycle-state ACTIVE \
            --query "data[*].id" --raw-output 2>/dev/null || true)
          for sid in $SESSIONS; do
            echo "Deleting: $sid"
            oci bastion session delete --session-id "$sid" --force || true
          done
