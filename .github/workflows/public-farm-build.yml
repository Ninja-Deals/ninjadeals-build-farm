name: Public Farm Build (ARM64)

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-build]

env:
  REGISTRY: ghcr.io

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          # Default full list of services
          FULL_LIST='["bff","comment","deal","discovery","following","forum","frontend","hello","identity","inbox","indexing-projection","media","moderation","notification","offer","price-collector","price-history","pricing","ranking","reputation","rewards","saved-items","search","user-profile","vote","wallet"]'

          # toJson() returns pretty-printed JSON; jq -c compacts it to a single line
          # so the matrix value fits in GITHUB_OUTPUT's key=value format
          SERVICES_RAW='${{ toJson(github.event.client_payload.services) }}'

          if [ -z "$SERVICES_RAW" ] || [ "$SERVICES_RAW" == "null" ]; then
            echo "No services list provided. Using full build list."
            RESULT=$FULL_LIST
          else
            RESULT=$(echo "$SERVICES_RAW" | jq -c '.')
            echo "Triggered for services: $RESULT"
          fi

          echo "matrix={\"service\":$RESULT}" >> $GITHUB_OUTPUT

  build-and-deploy:
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false       # one service failing does NOT cancel others
      max-parallel: 10       # cap concurrent bastion sessions to avoid OCI rate limits
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    permissions:
      contents: read
      packages: write

    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_KEY_FILE }}
      OCI_CLI_REGION: ${{ secrets.OCI_REGION }}

    steps:
      - name: Checkout Private Monorepo
        uses: actions/checkout@v4.1.0
        with:
          repository: 'Ninja-Deals/ninjadeals-main'
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PRIVATE_REPO_PAT }}

      # ── BUILD ────────────────────────────────────────────────────────────────
      - name: Build and Push for ARM64
        run: |
          echo "Building ${{ matrix.service }} for linux/arm64..."
          IMAGE="ghcr.io/ninja-deals/ninjadeals-main/${{ matrix.service }}:latest"
          if [ "${{ matrix.service }}" = "frontend" ]; then
            docker buildx build --platform linux/arm64 \
              --cache-from=type=gha,scope=frontend \
              --cache-to=type=gha,mode=max,scope=frontend \
              --push \
              -f frontend/Dockerfile -t $IMAGE frontend/
          elif [ "${{ matrix.service }}" = "ranking" ]; then
            docker buildx build --platform linux/arm64 \
              --cache-from=type=gha,scope=ranking \
              --cache-to=type=gha,mode=max,scope=ranking \
              --push \
              -f services/ranking/Dockerfile -t $IMAGE services/ranking/
          else
            docker buildx build --platform linux/arm64 \
              --cache-from=type=gha,scope=${{ matrix.service }} \
              --cache-to=type=gha,mode=max,scope=${{ matrix.service }} \
              --push \
              -f services/${{ matrix.service }}/Dockerfile -t $IMAGE .
          fi

      # ── DEPLOY (runs immediately after this service's build succeeds) ────────
      - name: Set up OCI CLI
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        with:
          command: 'oci --version'

      - name: Create Bastion Session
        id: create_session
        run: |
          tr -d '\n\r' < infra/bastion_key.pub > b_key.pub
          SESSION_ID=$(oci bastion session create-port-forwarding \
            --bastion-id ${{ secrets.BASTION_ID }} \
            --display-name "deploy-${{ matrix.service }}-$(date +%s)" \
            --ssh-public-key-file b_key.pub \
            --target-private-ip 10.0.30.20 \
            --target-port 22 \
            --session-ttl 1800 \
            --query "data.id" --raw-output)
          echo "session_id=$SESSION_ID" >> $GITHUB_OUTPUT

      - name: Wait for Session ACTIVE
        run: |
          for i in {1..30}; do
            STATE=$(oci bastion session get \
              --session-id ${{ steps.create_session.outputs.session_id }} \
              --query "data.\"lifecycle-state\"" --raw-output)
            echo "Session state: $STATE"
            if [ "$STATE" == "ACTIVE" ]; then break; fi
            if [ "$STATE" == "FAILED" ] || [ "$STATE" == "DELETED" ]; then
              echo "Bastion session failed to become active"
              exit 1
            fi
            sleep 10
          done

      - name: Deploy ${{ matrix.service }}
        run: |
          SSH_CMD=$(oci bastion session get \
            --session-id ${{ steps.create_session.outputs.session_id }} \
            --query "data.\"ssh-metadata\".command" --raw-output)

          if [ -n "${{ secrets.BASTION_PRIVATE_KEY }}" ]; then
            echo "${{ secrets.BASTION_PRIVATE_KEY }}" > b_key
          else
            cp infra/bastion_key b_key
          fi
          chmod 600 b_key

          if [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > d_key
          else
            cp infra/deploy_ssh_key d_key
          fi
          chmod 600 d_key

          FINAL_SSH_CMD=$(echo "$SSH_CMD" \
            | sed "s|<privateKey>|b_key|g" \
            | sed "s|<localPort>|2222|g" \
            | sed "s|ssh |ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes |")

          echo "Opening bastion tunnel..."
          $FINAL_SSH_CMD &
          TUNNEL_PID=$!

          for i in {1..30}; do
            if nc -z localhost 2222; then
              echo "Tunnel established."
              break
            fi
            if ! kill -0 $TUNNEL_PID 2>/dev/null; then
              echo "ERROR: Tunnel process died."
              exit 1
            fi
            sleep 2
          done

          echo "Pulling and restarting ${{ matrix.service }}..."
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o IdentitiesOnly=yes -i d_key -p 2222 opc@127.0.0.1 \
            "cd /opt/ninjadeals/services && \
             sudo docker compose -f services.yml pull ${{ matrix.service }} && \
             sudo docker compose -f services.yml up -d ${{ matrix.service }} && \
             echo '✓ ${{ matrix.service }} deployed successfully'"

          kill $TUNNEL_PID || true

      - name: Cleanup Bastion Session
        if: always()
        run: |
          if [ -n "${{ steps.create_session.outputs.session_id }}" ]; then
            oci bastion session delete \
              --session-id ${{ steps.create_session.outputs.session_id }} \
              --force || true
          fi
