name: Public Farm Build (ARM64)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-build]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: 
          - bff
          - comment
          - deal
          - discovery
          - following
          - forum
          - frontend
          - hello
          - identity
          - inbox
          - indexing-projection
          - media
          - moderation
          - notification
          - offer
          - price-collector
          - price-history
          - pricing
          - ranking
          - reputation
          - rewards
          - saved-items
          - search
          - user-profile
          - vote
          - wallet

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Private Monorepo
        uses: actions/checkout@v5
        with:
          repository: 'Ninja-Deals/ninjadeals-main'
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Build and Push for ARM64
        run: |
          echo "Building ${{ matrix.service }} for linux/arm64 target architecture..."
          IMAGE="ghcr.io/ninja-deals/ninjadeals-main/${{ matrix.service }}:latest"
          if [ "${{ matrix.service }}" = "frontend" ]; then
            docker buildx build --platform linux/arm64 \
              --cache-from=type=gha,scope=frontend \
              --cache-to=type=gha,mode=max,scope=frontend \
              --push \
              -f frontend/Dockerfile -t $IMAGE frontend/
          elif [ "${{ matrix.service }}" = "ranking" ]; then
            docker buildx build --platform linux/arm64 \
              --cache-from=type=gha,scope=ranking \
              --cache-to=type=gha,mode=max,scope=ranking \
              --push \
              -f services/ranking/Dockerfile -t $IMAGE services/ranking/
          else
            docker buildx build --platform linux/arm64 \
              --cache-from=type=gha,scope=${{ matrix.service }} \
              --cache-to=type=gha,mode=max,scope=${{ matrix.service }} \
              --push \
              -f services/${{ matrix.service }}/Dockerfile -t $IMAGE .
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy via SSH ProxyJump
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.APPS_INSTANCE_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.SSH_HOST }}
          proxy_username: ${{ secrets.SSH_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/ninjadeals/services
            docker compose pull
            docker compose up -d
