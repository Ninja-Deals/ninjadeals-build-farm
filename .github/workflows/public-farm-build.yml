name: Public Farm Build (ARM64)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-build]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: 
          - bff
          - comment
          - deal
          - discovery
          - following
          - forum
          - frontend
          - hello
          - identity
          - inbox
          - indexing-projection
          - media
          - moderation
          - notification
          - offer
          - price-collector
          - price-history
          - pricing
          - ranking
          - reputation
          - rewards
          - saved-items
          - search
          - user-profile
          - vote
          - wallet

    steps:
      - name: Checkout Private Monorepo
        uses: actions/checkout@v5
        with:
          repository: 'Ninja-Deals/ninjadeals-main'
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build for ARM64
        run: |
          echo "Building ${{ matrix.service }} for linux/arm64 target architecture..."
          if [ "${{ matrix.service }}" = "frontend" ]; then
            docker buildx build --platform linux/arm64 -f frontend/Dockerfile -t ninjadeals-frontend:arm64 frontend/
          elif [ "${{ matrix.service }}" = "ranking" ]; then
            docker buildx build --platform linux/arm64 -f services/ranking/Dockerfile -t ninjadeals-ranking:arm64 services/ranking/
          else
            docker buildx build --platform linux/arm64 -f services/${{ matrix.service }}/Dockerfile -t ninjadeals-${{ matrix.service }}:arm64 .
          fi
