name: Public Farm Build (ARM64)

on:
  push:
    branches: [main]
    paths-ignore: ['.github/workflows/**', 'tests/**', 'docs/**']
  workflow_dispatch:
    inputs:
      services:
        description: 'Retained production services, comma-separated; empty builds all 22.'
        required: false
        default: ''
      source_ref:
        description: 'Full private monorepo commit; empty resolves main once.'
        required: false
        default: ''
      build_only:
        description: 'Build immutable images only; intentionally skip production deployment.'
        type: boolean
        default: false
      deployment_mode:
        description: 'dry-run prepares and reviews without changing workloads; apply deploys production.'
        type: choice
        options: [apply, dry-run]
        default: apply
  repository_dispatch:
    types: [trigger-build]

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.request.outputs.matrix }}
      services: ${{ steps.request.outputs.services }}
      source_ref: ${{ steps.source.outputs.source_ref }}
      build_only: ${{ steps.request.outputs.build_only }}
      deployment_mode: ${{ steps.request.outputs.deployment_mode }}
    steps:
      - name: Validate release request
        id: request
        env:
          REQUESTED_SERVICES: ${{ inputs.services }}
          PAYLOAD_SERVICES: ${{ toJson(github.event.client_payload.services) }}
          REQUESTED_SOURCE: ${{ inputs.source_ref || github.event.client_payload.source_ref }}
          BUILD_ONLY: ${{ inputs.build_only || github.event.client_payload.build_only || false }}
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode || github.event.client_payload.deployment_mode || 'apply' }}
        run: |
          python3 - <<'PY'
          import json, os, re
          allowed = 'bff comment deal discovery following forum frontend identity inbox indexing-projection interaction media moderation notification offer pricing reputation saved-items search user-profile vote wallet'.split()
          source = os.environ['REQUESTED_SOURCE']
          if source and not re.fullmatch('[0-9a-f]{40}', source): raise SystemExit('source_ref must be a full lowercase commit SHA')
          raw = os.environ['REQUESTED_SERVICES']
          payload = json.loads(os.environ['PAYLOAD_SERVICES'])
          services = [s.strip() for s in raw.split(',')] if raw else payload if payload is not None else allowed
          if not isinstance(services, list) or not services or any(not isinstance(s, str) or s not in allowed for s in services) or len(set(services)) != len(services):
              raise SystemExit('services must be distinct retained production service names')
          mode = os.environ['DEPLOYMENT_MODE']
          only = os.environ['BUILD_ONLY']
          if mode not in ('apply', 'dry-run') or only not in ('true', 'false'): raise SystemExit('invalid release mode')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'service': services}, separators=(',', ':')) + '\n')
              output.write('services=' + ','.join(services) + '\n')
              output.write('build_only=' + only + '\ndeployment_mode=' + mode + '\n')
          PY
      - name: Resolve private source once
        uses: actions/checkout@v6
        with:
          repository: Ninja-Deals/ninjadeals-main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ inputs.source_ref || github.event.client_payload.source_ref || 'main' }}
          persist-credentials: false
      - name: Pin exact source
        id: source
        run: |
          set -euo pipefail
          printf 'source_ref=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout pinned private source
        uses: actions/checkout@v6
        with:
          repository: Ninja-Deals/ninjadeals-main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ needs.setup.outputs.source_ref }}
          persist-credentials: false
      - name: Verify private source
        env:
          EXPECTED_SOURCE: ${{ needs.setup.outputs.source_ref }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE" ]
          [ -z "$(git status --porcelain)" ]
          printf 'private_source=%s\n' "$EXPECTED_SOURCE"
      - uses: docker/setup-qemu-action@v4
        with:
          cache-image: false
      - uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PRIVATE_REPO_PAT }}
      - name: Build and Push ${{ matrix.service }} (ARM64)
        env:
          SERVICE: ${{ matrix.service }}
          PRIVATE_SOURCE: ${{ needs.setup.outputs.source_ref }}
          OLA_KEY: ${{ secrets.NEXT_PUBLIC_OLA_MAPS_API_KEY }}
          VAPID_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/ninja-deals/ninjadeals-main/$SERVICE:$SERVICE-$PRIVATE_SOURCE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          METADATA_FILE="$RUNNER_TEMP/$SERVICE-build-metadata.json"
          EXTRA=()
          CONTEXT=.
          DOCKERFILE="services/$SERVICE/Dockerfile"
          if [ "$SERVICE" = frontend ]; then
            CONTEXT=frontend/
            DOCKERFILE=frontend/Dockerfile
            EXTRA=(--build-arg NEXT_PUBLIC_CAPTCHA_ENABLED=false
              --build-arg NEXT_PUBLIC_OAUTH_GOOGLE_ENABLED=true
              --build-arg NEXT_PUBLIC_MFA_ENABLED=false
              --build-arg NEXT_PUBLIC_GOOGLE_ONLY_AUTH_ENABLED=true
              --build-arg NEXT_PUBLIC_SENTRY_ENVIRONMENT=production
              --build-arg NEXT_PUBLIC_OFFERS_V2_ENABLED=true
              --build-arg "NEXT_PUBLIC_OLA_MAPS_API_KEY=$OLA_KEY"
              --build-arg "NEXT_PUBLIC_VAPID_PUBLIC_KEY=$VAPID_KEY")
          fi
          docker buildx build --platform linux/arm64 \
            --cache-from="type=gha,scope=$SERVICE" --cache-to="type=gha,mode=max,scope=$SERVICE" \
            --output type=image,push=true,compression=zstd,compression-level=3,force-compression=true \
            --metadata-file "$METADATA_FILE" "${EXTRA[@]}" -f "$DOCKERFILE" -t "$IMAGE" "$CONTEXT"
          DIGEST=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$METADATA_FILE")
          mkdir -p "$RUNNER_TEMP/release"
          jq -n --arg source_ref "$PRIVATE_SOURCE" --arg service "$SERVICE" \
            --arg image "ghcr.io/ninja-deals/ninjadeals-main/$SERVICE@$DIGEST" \
            '{source_ref:$source_ref,service:$service,image:$image}' > "$RUNNER_TEMP/release/$SERVICE.json"
          printf 'private_source=%s\nimage_tag=%s\nimage_digest=%s\n' "$PRIVATE_SOURCE" "$IMAGE" "$DIGEST"
      - name: Publish immutable release receipt
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.service }}
          path: ${{ runner.temp }}/release/${{ matrix.service }}.json
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: [setup, build]
    if: needs.setup.outputs.build_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    concurrency:
      group: production-retained
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_KEY_FILE }}
      OCI_CLI_REGION: ${{ secrets.OCI_REGION }}
      BASTION_ID: ${{ secrets.BASTION_ID }}
      PRIVATE_SOURCE: ${{ needs.setup.outputs.source_ref }}
      DEPLOYMENT_MODE: ${{ needs.setup.outputs.deployment_mode }}
      SELECTED_SERVICES: ${{ needs.setup.outputs.services }}
    steps:
      - name: Checkout pinned private source
        uses: actions/checkout@v6
        with:
          repository: Ninja-Deals/ninjadeals-main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ needs.setup.outputs.source_ref }}
          persist-credentials: false
      - name: Verify deploy source
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$PRIVATE_SOURCE" ]
          [ -z "$(git status --porcelain)" ]
      - name: Download this run's immutable receipts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - name: Verify production deployment preservation contracts
        run: python3 -m unittest discover -s scripts/deploy -p 'test_production_*.py'
      - name: Set up OCI CLI
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        with:
          command: 'oci --version'
      - name: Materialize existing deploy key
        env:
          DEPLOY_KEY_CONTENT: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [ -n "$DEPLOY_KEY_CONTENT" ]
          SSH_KEY="$RUNNER_TEMP/production-deploy-key"
          printf '%s\n' "$DEPLOY_KEY_CONTENT" > "$SSH_KEY"
          ssh-keygen -y -f "$SSH_KEY" > "$SSH_KEY.pub"
          printf 'SSH_KEY=%s\n' "$SSH_KEY" >> "$GITHUB_ENV"
      - name: Prepare, review and deploy retained production
        run: |
          set -euo pipefail
          python3 scripts/deploy/production_actions.py deploy \
            --receipts "$RUNNER_TEMP/release" --source "$PRIVATE_SOURCE" --services "$SELECTED_SERVICES" \
            --plan-id "farm-production-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --mode "$DEPLOYMENT_MODE"
      - name: Remove owned temporary key
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/production-deploy-key" "$RUNNER_TEMP/production-deploy-key.pub"
