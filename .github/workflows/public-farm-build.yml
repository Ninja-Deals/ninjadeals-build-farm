name: Public Farm Build (ARM64)

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-build]

env:
  REGISTRY: ghcr.io

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          FULL_LIST='["bff","comment","deal","discovery","following","forum","frontend","hello","identity","inbox","indexing-projection","media","moderation","notification","offer","price-collector","price-history","pricing","ranking","reputation","rewards","saved-items","search","user-profile","vote","wallet"]'

          SERVICES_RAW='${{ toJson(github.event.client_payload.services) }}'

          if [ -z "$SERVICES_RAW" ] || [ "$SERVICES_RAW" == "null" ]; then
            echo "No services list provided. Using full build list."
            RESULT=$FULL_LIST
          else
            RESULT=$(echo "$SERVICES_RAW" | jq -c '.')
            echo "Triggered for services: $RESULT"
          fi

          echo "matrix={\"service\":$RESULT}" >> $GITHUB_OUTPUT

  # One job per service. Build and bastion session setup run in parallel within
  # the job — bastion is ready by the time docker push completes, so deploy
  # starts immediately with no extra wait.
  build-and-deploy:
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # one service failing does NOT cancel others
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    permissions:
      contents: read
      packages: write

    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_KEY_FILE }}
      OCI_CLI_REGION: ${{ secrets.OCI_REGION }}

    steps:
      - name: Checkout Private Monorepo
        uses: actions/checkout@v4   # v4.2+ uses Node.js 24
        with:
          repository: 'Ninja-Deals/ninjadeals-main'
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      # Set up OCI CLI before the build step so it's available to the
      # background bastion process that runs during docker build.
      - name: Set up OCI CLI
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        with:
          command: 'oci --version'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PRIVATE_REPO_PAT }}

      # Bastion session creation (~30-60s) runs in the background while
      # docker build+push (~2 min) runs in the foreground. By the time the
      # image is pushed the session is already ACTIVE — deploy starts immediately.
      - name: Build, Push and Prepare Bastion in Parallel
        run: |
          # ── Background: create & wait for bastion session ─────────────────
          (
            tr -d '\n\r' < infra/bastion_key.pub > /tmp/b_key.pub
            SESSION_ID=$(oci bastion session create-port-forwarding \
              --bastion-id ${{ secrets.BASTION_ID }} \
              --display-name "deploy-${{ matrix.service }}-$(date +%s)" \
              --ssh-public-key-file /tmp/b_key.pub \
              --target-private-ip 10.0.30.20 \
              --target-port 22 \
              --session-ttl 1800 \
              --query "data.id" --raw-output 2>/tmp/session_err || echo "")

            if [ -z "$SESSION_ID" ] || [ "$SESSION_ID" = "null" ]; then
              echo "FAILED:create" > /tmp/session_state
              exit 1
            fi

            echo "$SESSION_ID" > /tmp/session_id

            for i in {1..30}; do
              STATE=$(oci bastion session get \
                --session-id "$SESSION_ID" \
                --query "data.\"lifecycle-state\"" --raw-output 2>/dev/null || echo "UNKNOWN")
              if [ "$STATE" = "ACTIVE" ]; then
                echo "ACTIVE" > /tmp/session_state
                break
              fi
              if [ "$STATE" = "FAILED" ] || [ "$STATE" = "DELETED" ]; then
                echo "FAILED:$STATE" > /tmp/session_state
                break
              fi
              sleep 10
            done
          ) &
          echo $! > /tmp/bastion_pid

          # ── Foreground: build and push image ─────────────────────────────
          IMAGE="ghcr.io/ninja-deals/ninjadeals-main/${{ matrix.service }}:latest"
          if [ "${{ matrix.service }}" = "frontend" ]; then
            docker buildx build --platform linux/arm64 \
              --cache-from=type=gha,scope=frontend \
              --cache-to=type=gha,mode=max,scope=frontend \
              --push \
              -f frontend/Dockerfile -t $IMAGE frontend/
          elif [ "${{ matrix.service }}" = "ranking" ]; then
            docker buildx build --platform linux/arm64 \
              --cache-from=type=gha,scope=ranking \
              --cache-to=type=gha,mode=max,scope=ranking \
              --push \
              -f services/ranking/Dockerfile -t $IMAGE services/ranking/
          else
            docker buildx build --platform linux/arm64 \
              --cache-from=type=gha,scope=${{ matrix.service }} \
              --cache-to=type=gha,mode=max,scope=${{ matrix.service }} \
              --push \
              -f services/${{ matrix.service }}/Dockerfile -t $IMAGE .
          fi

          # ── Confirm bastion is ready (should already be done) ────────────
          echo "Image pushed. Waiting for bastion session (likely already active)..."
          wait $(cat /tmp/bastion_pid) || true

          STATE=$(cat /tmp/session_state 2>/dev/null || echo "MISSING")
          if [ "$STATE" != "ACTIVE" ]; then
            echo "ERROR: Bastion session not active: $STATE"
            cat /tmp/session_err 2>/dev/null || true
            exit 1
          fi
          echo "Bastion session is ACTIVE — deploying immediately."

      - name: Deploy ${{ matrix.service }}
        run: |
          SESSION_ID=$(cat /tmp/session_id)

          SSH_CMD=$(oci bastion session get \
            --session-id "$SESSION_ID" \
            --query "data.\"ssh-metadata\".command" --raw-output)

          if [ -n "${{ secrets.BASTION_PRIVATE_KEY }}" ]; then
            echo "${{ secrets.BASTION_PRIVATE_KEY }}" > b_key
          else
            cp infra/bastion_key b_key
          fi
          chmod 600 b_key

          if [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > d_key
          else
            cp infra/deploy_ssh_key d_key
          fi
          chmod 600 d_key

          FINAL_SSH_CMD=$(echo "$SSH_CMD" \
            | sed "s|<privateKey>|b_key|g" \
            | sed "s|<localPort>|2222|g" \
            | sed "s|ssh |ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes |")

          echo "Opening bastion tunnel..."
          $FINAL_SSH_CMD &
          TUNNEL_PID=$!

          for i in {1..30}; do
            if nc -z localhost 2222; then
              echo "Tunnel established."
              break
            fi
            if ! kill -0 $TUNNEL_PID 2>/dev/null; then
              echo "ERROR: Tunnel process died."
              exit 1
            fi
            sleep 2
          done

          echo "Pulling and restarting ${{ matrix.service }}..."
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o IdentitiesOnly=yes -i d_key -p 2222 opc@127.0.0.1 \
            "cd /opt/ninjadeals/services && \
             sudo docker compose -f services.yml pull ${{ matrix.service }} && \
             sudo docker compose -f services.yml up -d ${{ matrix.service }} && \
             echo '✓ ${{ matrix.service }} deployed'"

          kill $TUNNEL_PID || true

      - name: Cleanup Bastion Session
        if: always()
        run: |
          SESSION_ID=$(cat /tmp/session_id 2>/dev/null || echo "")
          if [ -n "$SESSION_ID" ]; then
            oci bastion session delete \
              --session-id "$SESSION_ID" \
              --force || true
          fi
